
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة نتيجة الطلاب — الفاروق الثانوية بنين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root {
  /* ── Brick / Terracotta palette ── */
  --brick:       #b94a28;
  --brick-light: #d4623a;
  --brick-dark:  #8c3318;
  --terra:       #c5633a;
  --cream:       #f5ede3;
  --cream2:      #fdf6ef;
  --sand:        #e8d5b7;
  --sand2:       #ddc9a3;
  --warm-brown:  #7a3e2a;
  --deep:        #3b1a0e;
  --text:        #3b1a0e;
  --text2:       #7a5a48;
  --text3:       #b08878;
  --border:      rgba(185,74,40,.14);
  --surface:     rgba(253,246,239,.88);
  --shadow-sm:   0 4px 20px rgba(140,51,24,.10);
  --shadow:      0 8px 40px rgba(140,51,24,.13);
  --shadow-lg:   0 20px 60px rgba(140,51,24,.18);
  --radius:      20px;
  --radius-sm:   12px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Tajawal',sans-serif;
  background:var(--cream);
  min-height:100vh;
  direction:rtl;
  overflow-x:hidden;
}

/* ── BACKGROUND ── */
.bg-wrap{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
}
.bg-blob{
  position:absolute;border-radius:50%;filter:blur(90px);opacity:.32;
  animation:blobDrift 12s ease-in-out infinite alternate;
}
.blob-a{width:520px;height:520px;background:radial-gradient(circle,#d4623a,#b94a28);top:-180px;right:-120px;animation-delay:0s;}
.blob-b{width:420px;height:420px;background:radial-gradient(circle,#e8c9a0,#c9976a);bottom:-120px;left:-80px;animation-delay:-5s;}
.blob-c{width:360px;height:360px;background:radial-gradient(circle,#f2d0b0,#d4836a);top:45%;left:30%;animation-delay:-9s;}
@keyframes blobDrift{
  from{transform:translate(0,0) scale(1);}
  to{transform:translate(28px,18px) scale(1.06);}
}

/* ── PARTICLES ── */
.particles-wrap{position:fixed;inset:0;z-index:0;pointer-events:none;}
.pt{
  position:absolute;border-radius:50%;opacity:0;
  animation:ptRise 9s linear infinite;
}
@keyframes ptRise{
  0%{transform:translateY(100vh) scale(0);opacity:0;}
  10%{opacity:.45;}
  85%{opacity:.1;}
  100%{transform:translateY(-15vh) scale(1.2);opacity:0;}
}

/* ── PAGE ── */
.page-wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}

/* ── HEADER ── */
header{
  padding:26px 24px 0;
  text-align:center;
  animation:slideDown .75s cubic-bezier(.22,1,.36,1) both;
}
@keyframes slideDown{from{transform:translateY(-44px);opacity:0;}to{transform:translateY(0);opacity:1;}}

.header-pill{
  display:inline-flex;align-items:center;gap:16px;
  background:var(--surface);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border:1.5px solid rgba(185,74,40,.18);
  border-radius:60px;
  padding:14px 30px;
  box-shadow:var(--shadow);
}
.h-icon{
  width:54px;height:54px;
  background:linear-gradient(135deg,var(--brick),var(--brick-light));
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;color:#fff;
  flex-shrink:0;
  box-shadow:0 8px 22px rgba(140,51,24,.35);
  animation:heartbeat 3.2s ease-in-out infinite;
}
@keyframes heartbeat{
  0%,100%{box-shadow:0 8px 22px rgba(140,51,24,.35);}
  50%{box-shadow:0 8px 34px rgba(140,51,24,.6);}
}
.h-text h1{
  font-size:1.35rem;font-weight:900;
  background:linear-gradient(135deg,var(--brick-dark),var(--terra));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1.25;
}
.h-text p{font-size:.76rem;color:var(--text2);font-weight:600;margin-top:2px;}

.year-tag{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,var(--brick),var(--brick-light));
  color:#fff;border-radius:30px;
  padding:5px 18px;font-size:.75rem;font-weight:700;
  margin-top:14px;
  box-shadow:0 4px 16px rgba(140,51,24,.3);
  animation:popIn .8s .3s cubic-bezier(.22,1,.36,1) both;
}
@keyframes popIn{from{opacity:0;transform:scale(.8);}to{opacity:1;transform:scale(1);}}

/* ── MAIN ── */
main{
  flex:1;max-width:860px;margin:0 auto;width:100%;
  padding:32px 20px 60px;
  display:flex;flex-direction:column;gap:22px;
}

/* ── GLASS CARD ── */
.g-card{
  background:var(--surface);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
  animation:cardIn .6s cubic-bezier(.22,1,.36,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(26px);}to{opacity:1;transform:translateY(0);}}

.c-head{
  padding:18px 24px;
  display:flex;align-items:center;gap:12px;
  border-bottom:1.5px solid var(--border);
  background:rgba(245,237,227,.65);
}
.c-head-icon{
  width:40px;height:40px;
  background:linear-gradient(135deg,var(--brick),var(--brick-light));
  border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;color:#fff;
  box-shadow:0 4px 12px rgba(140,51,24,.3);
  flex-shrink:0;
}
.c-head-icon.warm{background:linear-gradient(135deg,#c4813a,#e0a060);}
.c-head h2{font-size:1rem;font-weight:800;color:var(--text);}
.c-body{padding:28px 24px;}

/* ── FORM ── */
.form-row{
  display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:22px;
}
.form-group{display:flex;flex-direction:column;gap:8px;}
.f-label{
  font-size:.84rem;font-weight:700;color:var(--text);
  display:flex;align-items:center;gap:6px;
}
.f-label i{color:var(--brick);}
.f-ctrl{
  background:rgba(255,255,255,.85);
  border:2px solid rgba(185,74,40,.14);
  border-radius:var(--radius-sm);
  padding:13px 16px;
  font-family:'Tajawal',sans-serif;
  font-size:.95rem;color:var(--text);
  outline:none;direction:rtl;width:100%;
  transition:all .25s;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.f-ctrl:focus{
  border-color:var(--brick);background:#fff;
  box-shadow:0 0 0 4px rgba(185,74,40,.1),0 2px 8px rgba(0,0,0,.04);
  transform:translateY(-1px);
}
.f-ctrl::placeholder{color:var(--text3);}

/* ── SEARCH BTN ── */
.btn-search{
  width:100%;padding:15px;
  background:linear-gradient(135deg,var(--brick-dark),var(--brick),var(--brick-light));
  background-size:200% 100%;background-position:right;
  color:#fff;border:none;border-radius:var(--radius-sm);
  font-family:'Tajawal',sans-serif;
  font-size:1.05rem;font-weight:800;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:all .3s;
  box-shadow:0 8px 26px rgba(140,51,24,.32);
  position:relative;overflow:hidden;
  letter-spacing:.3px;
}
.btn-search:hover{
  background-position:left;
  transform:translateY(-2px);
  box-shadow:0 12px 34px rgba(140,51,24,.42);
}
.btn-search:active{transform:translateY(0);}
.btn-search::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);
  opacity:0;transition:opacity .25s;
}
.btn-search:hover::after{opacity:1;}

/* ── LOADING ── */
.loading-inner{display:none;text-align:center;padding:40px 24px;}
.loading-inner.on{display:block;}
.spin-ring{
  width:56px;height:56px;
  border:4px solid rgba(185,74,40,.15);
  border-top-color:var(--brick);
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-inner p{color:var(--text2);font-size:.95rem;font-weight:600;}
.dots span{
  display:inline-block;width:6px;height:6px;
  background:var(--brick);border-radius:50%;margin:0 2px;
  animation:dot .8s ease-in-out infinite;
}
.dots span:nth-child(2){animation-delay:.15s;}
.dots span:nth-child(3){animation-delay:.3s;}
@keyframes dot{0%,80%,100%{transform:scale(0);}40%{transform:scale(1);}}

/* ── ALERTS ── */
.alert{
  display:none;align-items:center;gap:12px;
  padding:16px 20px;border-radius:var(--radius-sm);
  font-size:.92rem;font-weight:600;
  animation:cardIn .35s both;
}
.alert.on{display:flex;}
.al-err{
  background:linear-gradient(135deg,#fff5f2,#ffe8e0);
  border:1.5px solid rgba(185,74,40,.25);color:var(--brick-dark);
}
.al-warn{
  background:linear-gradient(135deg,#fffbf0,#fff4d6);
  border:1.5px solid #f5c97a;color:#8a5c00;
}
.alert i{font-size:1.1rem;flex-shrink:0;}

/* ── MULTI RESULTS ── */
.multi-card{display:none;animation:cardIn .5s both;}
.multi-card.on{display:block;}
.s-list{padding:8px 0;}
.s-item{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:16px 24px;border-bottom:1.5px solid var(--border);
  transition:background .2s;cursor:pointer;
}
.s-item:last-child{border-bottom:none;}
.s-item:hover{background:rgba(185,74,40,.04);}
.si-av{
  width:42px;height:42px;
  background:linear-gradient(135deg,var(--brick),var(--brick-light));
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#fff;flex-shrink:0;
  box-shadow:0 4px 10px rgba(140,51,24,.25);
}
.si-inf{flex:1;}
.si-name{font-weight:800;color:var(--text);font-size:.95rem;margin-bottom:2px;}
.si-meta{font-size:.78rem;color:var(--text2);}
.btn-sm{
  padding:8px 18px;
  background:linear-gradient(135deg,var(--brick),var(--brick-light));
  color:#fff;border:none;border-radius:30px;
  font-family:'Tajawal',sans-serif;font-size:.82rem;font-weight:700;
  cursor:pointer;white-space:nowrap;flex-shrink:0;
  transition:all .2s;
  box-shadow:0 4px 12px rgba(140,51,24,.25);
}
.btn-sm:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(140,51,24,.35);}

/* ── RESULT HERO ── */
.res-card{display:none;animation:cardIn .55s cubic-bezier(.22,1,.36,1) both;}
.res-card.on{display:block;}

.res-hero{
  padding:32px 28px 28px;
  background:linear-gradient(135deg,var(--brick-dark) 0%,var(--brick) 55%,var(--terra) 100%);
  position:relative;overflow:hidden;
}
.res-hero::before{
  content:'';position:absolute;inset:0;
  background:url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='40' cy='40' r='36' fill='none' stroke='rgba(255,255,255,.05)' stroke-width='2'/%3E%3Ccircle cx='40' cy='40' r='22' fill='none' stroke='rgba(255,255,255,.04)' stroke-width='2'/%3E%3C/svg%3E") center/180px repeat;
}
.res-inner{position:relative;z-index:1;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.res-av{
  width:72px;height:72px;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(10px);
  border:2px solid rgba(255,255,255,.38);
  border-radius:24px;
  display:flex;align-items:center;justify-content:center;
  font-size:32px;color:#fff;flex-shrink:0;
  animation:avatarPop .65s .15s cubic-bezier(.22,1,.36,1) both;
}
@keyframes avatarPop{from{transform:scale(0) rotate(-18deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
.res-info{flex:1;}
.res-name{font-size:1.6rem;font-weight:900;color:#fff;line-height:1.2;margin-bottom:4px;}
.res-seat{font-size:.85rem;color:rgba(255,255,255,.72);font-weight:600;}
.res-seat i{margin-left:4px;}

.st-pill{
  padding:8px 20px;border-radius:30px;
  font-size:.88rem;font-weight:800;flex-shrink:0;
  animation:popIn .5s .3s both;
}
.pill-pass{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.4);color:#fff;}
.pill-fail{background:rgba(0,0,0,.2);border:1.5px solid rgba(255,255,255,.25);color:rgba(255,220,210,1);}
.pill-other{background:rgba(255,220,100,.18);border:1.5px solid rgba(255,220,100,.4);color:#ffe36a;}

/* ── INFO TILES ── */
.res-body{padding:28px;}
.info-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px;
}
.i-tile{
  background:rgba(255,255,255,.82);
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  padding:16px 14px;text-align:center;
  transition:all .25s;position:relative;overflow:hidden;
  animation:tileIn .5s cubic-bezier(.22,1,.36,1) both;
}
.i-tile:nth-child(1){animation-delay:.05s;}
.i-tile:nth-child(2){animation-delay:.10s;}
.i-tile:nth-child(3){animation-delay:.15s;}
.i-tile:nth-child(4){animation-delay:.20s;}
.i-tile:nth-child(5){animation-delay:.25s;}
.i-tile:nth-child(6){animation-delay:.30s;}
@keyframes tileIn{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
.i-tile:hover{transform:translateY(-4px);box-shadow:var(--shadow);}
.i-tile::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--brick),var(--brick-light));
  transform:scaleX(0);transition:transform .3s;transform-origin:right;
}
.i-tile:hover::after{transform:scaleX(1);}
.i-tile.gold::after{background:linear-gradient(90deg,#a0620a,#d4920a);}
.t-icon{font-size:1.4rem;color:var(--brick);margin-bottom:6px;}
.i-tile.gold .t-icon{color:#a0620a;}
.t-label{font-size:.72rem;color:var(--text3);font-weight:700;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
.t-val{font-size:1.1rem;font-weight:800;color:var(--text);}
.i-tile.gold .t-val{font-size:1.25rem;color:#7a4800;}

/* ── TABLE ── */
.sec-head{
  display:flex;align-items:center;gap:10px;
  margin-bottom:16px;font-size:.95rem;font-weight:800;color:var(--text);
}
.sec-head::after{content:'';flex:1;height:2px;background:linear-gradient(90deg,var(--border),transparent);}
.sec-head i{color:var(--brick);}

.t-scroll{overflow-x:auto;border-radius:var(--radius-sm);border:1.5px solid var(--border);}
.g-table{width:100%;border-collapse:collapse;min-width:380px;font-size:.9rem;}
.g-table thead tr{background:linear-gradient(135deg,var(--brick-dark),var(--brick));}
.g-table thead th{
  padding:13px 18px;text-align:center;
  color:#fff;font-weight:700;font-size:.83rem;white-space:nowrap;
}
.g-table tbody tr{
  border-bottom:1.5px solid var(--border);
  transition:background .15s;animation:rowSlide .4s both;
}
@keyframes rowSlide{from{opacity:0;transform:translateX(-12px);}to{opacity:1;transform:translateX(0);}}
.g-table tbody tr:last-child{border-bottom:none;}
.g-table tbody tr:hover{background:rgba(185,74,40,.04);}
.g-table tbody td{padding:12px 18px;text-align:center;color:var(--text2);}
.g-table tbody td:first-child{font-weight:700;color:var(--text);text-align:right;}

.g-chip{
  display:inline-block;padding:4px 12px;
  border-radius:20px;font-size:.82rem;font-weight:800;
}
.gc-ex {background:linear-gradient(135deg,#fdf0e6,#fad9b8);color:#8a3a00;}
.gc-vg {background:linear-gradient(135deg,#fef8ec,#faecc8);color:#7a5200;}
.gc-gd {background:linear-gradient(135deg,#fff8e8,#f5e3b4);color:#7a4800;}
.gc-ps {background:linear-gradient(135deg,#f5f0e8,#e8d8c0);color:#6b4020;}
.gc-fl {background:linear-gradient(135deg,#fdf0ee,#f5cfc8);color:#8c2810;}

.notes-box{
  background:linear-gradient(135deg,#fffbf0,#fff6e0);
  border:1.5px solid #e5c97a;
  border-radius:var(--radius-sm);
  padding:14px 18px;
  display:flex;gap:10px;align-items:flex-start;
  margin-top:20px;animation:cardIn .4s both;
}
.notes-box i{color:#c49020;flex-shrink:0;margin-top:2px;}
.notes-box p{font-size:.88rem;color:#7a5000;font-weight:600;line-height:1.7;}

/* ── ACTIONS ── */
.act-row{
  display:flex;gap:12px;flex-wrap:wrap;
  padding:22px 28px;
  background:rgba(245,237,227,.7);
  border-top:1.5px solid var(--border);
}
.btn-act{
  flex:1;min-width:130px;padding:13px 16px;
  border:none;border-radius:var(--radius-sm);
  font-family:'Tajawal',sans-serif;font-size:.88rem;font-weight:800;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .25s;position:relative;overflow:hidden;
}
.btn-act::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.18),transparent);
  opacity:0;transition:opacity .25s;
}
.btn-act:hover::after{opacity:1;}
.btn-act:hover{transform:translateY(-2px);}
.btn-act:active{transform:translateY(0);}

.b-print{
  background:linear-gradient(135deg,var(--brick-dark),var(--brick));
  color:#fff;box-shadow:0 6px 20px rgba(140,51,24,.28);
}
.b-print:hover{box-shadow:0 10px 28px rgba(140,51,24,.4);}

.b-cert{
  background:linear-gradient(135deg,#a06010,#d4920a);
  color:#fff;box-shadow:0 6px 20px rgba(160,96,16,.28);
}
.b-cert:hover{box-shadow:0 10px 28px rgba(160,96,16,.4);}

.b-new{
  background:rgba(185,74,40,.08);
  color:var(--brick);
  border:2px solid rgba(185,74,40,.22);
}
.b-new:hover{background:rgba(185,74,40,.14);border-color:var(--brick);}

/* ── FOOTER ── */
footer{
  text-align:center;padding:20px;
  color:var(--text3);font-size:.78rem;
  position:relative;z-index:1;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(185,74,40,.25);border-radius:10px;}

/* ── RESPONSIVE ── */
@media(max-width:680px){
  .header-pill{padding:12px 18px;gap:12px;}
  .h-icon{width:44px;height:44px;font-size:20px;border-radius:12px;}
  .h-text h1{font-size:1.1rem;}
  .form-row{grid-template-columns:1fr;}
  .info-grid{grid-template-columns:repeat(2,1fr);}
  .res-name{font-size:1.2rem;}
  .act-row{flex-direction:column;padding:18px;}
  .btn-act{width:100%;}
  .res-body{padding:20px 18px;}
  .c-body{padding:20px 18px;}
  main{padding:20px 14px 40px;}
}
@media(max-width:380px){
  .info-grid{grid-template-columns:1fr 1fr;}
  .res-av{width:58px;height:58px;font-size:26px;}
}
</style>
</head>
<body>

<div class="bg-wrap">
  <div class="bg-blob blob-a"></div>
  <div class="bg-blob blob-b"></div>
  <div class="bg-blob blob-c"></div>
</div>
<div class="particles-wrap" id="pts"></div>

<div class="page-wrap">

  <header>
    <div class="header-pill">
      <div class="h-icon"><i class="fas fa-graduation-cap"></i></div>
      <div class="h-text">
        <h1>بوابة نتيجة الصفين الأول والثاني الثانوي</h1>
        <p><i class="fas fa-school" style="margin-left:4px;color:var(--brick-light)"></i>الفاروق الثانوية بنين &mdash; نظام تجريبي للاستعلام</p>
      </div>
    </div>
    <div><span class="year-tag" id="yearTag"><i class="fas fa-calendar-days" style="margin-left:5px"></i></span></div>
    <div style="margin-top:12px">
      <span style="display:inline-flex;align-items:center;gap:7px;background:rgba(255,200,80,.18);border:1.5px solid rgba(210,150,20,.35);border-radius:30px;padding:5px 18px;font-size:.78rem;font-weight:700;color:#8a5e00;backdrop-filter:blur(8px);">
        <i class="fas fa-flask"></i> هذا الموقع نسخة تجريبية
      </span>
    </div>

  <main>

    <!-- Search -->
    <div class="g-card" style="animation-delay:.1s">
      <div class="c-head">
        <div class="c-head-icon"><i class="fas fa-magnifying-glass"></i></div>

    <!-- Multi results -->

      <div class="c-head">
        <div class="c-head-icon warm"><i class="fas fa-users"></i></div>
        <h2>تعددت نتائج البحث — اختر الطالب المطلوب</h2>
      </div>
      <div class="s-list" id="sList"></div>
    </div>

    <!-- Result -->
    <div class="g-card res-card" id="resCard">
      <div class="res-hero">
        <div class="res-inner">
          <div class="res-av"><i class="fas fa-user-graduate"></i></div>
          <div class="res-info">
            <div class="res-name" id="resName">—</div>
            <div class="res-seat"><i class="fas fa-hashtag"></i><span id="resSeat">—</span></div>
          </div>
          <div class="st-pill" id="resBadge">—</div>
        </div>

      <div class="res-body">
        <div class="info-grid" id="infoGrid"></div>

        <div id="gradesSec">
          <div class="sec-head"><i class="fas fa-table-list"></i>جدول المواد والدرجات</div>
          <div class="t-scroll">
            <table class="g-table">
              <thead><tr><th>المادة الدراسية</th><th>الدرجة</th></tr></thead>
              <tbody id="gradesBody"></tbody>
            </table>
          </div>
        </div>

        <div class="notes-box" id="notesArea" style="display:none">
          <i class="fas fa-note-sticky fa-lg"></i>
          <p id="notesText"></p>
        </div>

      <div class="act-row">
        <button class="btn-act b-print" onclick="printResult()">
          <i class="fas fa-print"></i> طباعة النتيجة الرسمية
        </button>
        <button class="btn-act b-cert" onclick="printCertificate()">
          <i class="fas fa-award"></i> طباعة شهادة التقدير
        </button>
        <button class="btn-act b-new" onclick="newSearch()">
          <i class="fas fa-rotate-right"></i> استعلام جديد

    <i class="fas fa-lock" style="margin-left:5px;color:var(--brick)"></i>
    جميع الحقوق محفوظة &mdash; بوابة نتائج الطلاب &copy; <span id="footerYear"></span>
  </footer>
</div>

<script>
// ── YEAR ──
var y=new Date().getFullYear();
document.getElementById('yearTag').innerHTML='<i class="fas fa-calendar-days" style="margin-left:5px"></i>العام الدراسي '+y+' / '+(y+1);
document.getElementById('footerYear').textContent=y;

// ── PARTICLES ──
(function(){
  var wrap=document.getElementById('pts');
  var colors=['#b94a28','#d4623a','#e8a07a','#c4813a','#e0c090','#f2d0b0'];
  for(var i=0;i<24;i++){
    var p=document.createElement('div');
    p.className='pt';
    var s=4+Math.random()*6;
    p.style.cssText='left:'+Math.random()*100+'%;'
      +'width:'+s+'px;height:'+s+'px;'
      +'background:'+colors[Math.floor(Math.random()*colors.length)]+';'
      +'animation-delay:'+Math.random()*9+'s;'
      +'animation-duration:'+(6+Math.random()*7)+'s;';
    wrap.appendChild(p);
  }
})();

// ── GLOBALS ──
var cachedData={};
var currentStudent=null;
var currentGradeLabel='';

// ── COLUMN KEYS ──
var SEAT   =['رقم الجلوس','رقم جلوس','رقم_الجلوس','جلوس','seat','seat_number','id','رقم'];
var NAME   =['اسم الطالب','اسم_الطالب','الاسم','اسم','name','student_name'];
var GRADE  =['الصف','صف','grade','class','level'];
var SEC    =['الشعبة','شعبة','القسم','قسم','section','class_section','division'];
var TOTAL  =['المجموع','مجموع','total','sum','إجمالي','اجمالي'];
var PCT    =['النسبة','نسبة','النسبة المئوية','percent','percentage','rate','%'];
var GLABEL =['التقدير','تقدير','grade_label','result_label','تقييم'];
var STATUS =['الحالة','حالة','status','نتيجة','قرار','decision'];
var NOTES  =['ملاحظات','ملاحظة','notes','note','remarks','تعليق'];

function matchCol(h,keys){
  h=String(h).trim().toLowerCase().replace(/\s+/g,'');
  for(var i=0;i<keys.length;i++){
    var k=keys[i].toLowerCase().replace(/\s+/g,'');
    if(h===k||h.indexOf(k)!==-1) return true;
  }
  return false;
}

function detectCols(headers){
  var m={seat:null,name:null,grade:null,section:null,total:null,percent:null,gradeLabel:null,status:null,notes:null,subjects:[]};
  headers.forEach(function(h,i){
    if(m.seat===null&&matchCol(h,SEAT)){m.seat=i;return;}
    if(m.name===null&&matchCol(h,NAME)){m.name=i;return;}
    if(m.grade===null&&matchCol(h,GRADE)){m.grade=i;return;}
    if(m.section===null&&matchCol(h,SEC)){m.section=i;return;}
    if(m.total===null&&matchCol(h,TOTAL)){m.total=i;return;}
    if(m.percent===null&&matchCol(h,PCT)){m.percent=i;return;}
    if(m.gradeLabel===null&&matchCol(h,GLABEL)){m.gradeLabel=i;return;}
    if(m.status===null&&matchCol(h,STATUS)){m.status=i;return;}
    if(m.notes===null&&matchCol(h,NOTES)){m.notes=i;return;}
  });
  var used=Object.values(m).filter(function(v){return typeof v==='number';});
  headers.forEach(function(h,i){
    if(used.indexOf(i)===-1&&h&&String(h).trim()!=='')
      m.subjects.push({idx:i,name:String(h).trim()});
  });
  return m;
}

function formatPct(v){
  if(!v||v==='—') return v;
  var n=parseFloat(String(v).replace(/[^\d.]/g,''));
  if(isNaN(n)) return v;
  // Excel stores % as decimal: 0.69 → 69%
  if(n>0 && n<=1) n=n*100;
  // Round to 2 decimal places, remove trailing zeros
  var s=n.toFixed(2).replace(/\.?0+$/,'');
  return s+'%';
}

function normAr(s){
  return String(s||'').replace(/[أإآا]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')
    .replace(/\s+/g,' ').trim().toLowerCase();
}
function convNums(s){
  return String(s).replace(/[٠١٢٣٤٥٦٧٨٩]/g,function(c){return c.charCodeAt(0)-1632;});
}

function loadExcel(g){
  return new Promise(function(res,rej){
    if(cachedData[g]){res(cachedData[g]);return;}
    fetch(g==='1'?'./1sanawe.xlsx':'./2sanawe.xlsx')
      .then(function(r){if(!r.ok)throw new Error('تعذّر تحميل ملف البيانات ('+r.status+')');return r.arrayBuffer();})
      .then(function(buf){
        var wb=XLSX.read(buf,{type:'array'});
        var ws=wb.Sheets[wb.SheetNames[0]];
        var raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        if(!raw||raw.length<2) throw new Error('الملف فارغ أو لا يحتوي على بيانات');
        var hr=0;
        for(var i=0;i<Math.min(5,raw.length);i++){
          if(raw[i].filter(function(c){return c!=='';}).length>2){hr=i;break;}
        }
        var headers=raw[hr].map(function(c){return String(c).trim();});
        var cm=detectCols(headers);
        var records=[];
        for(var r=hr+1;r<raw.length;r++){
          var row=raw[r];
          if(row.every(function(c){return c===''||c===null||c===undefined;})) continue;
          records.push({_headers:headers,_cm:cm,_raw:row});
        }
        cachedData[g]=records;res(records);
      }).catch(rej);
  });
}

function cv(rec,idx){
  if(idx===null||idx===undefined) return '';
  return rec._raw[idx]!==undefined?String(rec._raw[idx]).trim():'';
}

function searchRecs(records,query){
  query=convNums(query.trim());
  var isNum=/^\d+$/.test(query);
  var nq=normAr(query);
  return records.filter(function(r){
    var cm=r._cm;
    if(isNum) return convNums(cv(r,cm.seat))===query;
    return normAr(cv(r,cm.name)).indexOf(nq)!==-1;
  });
}

function gradeChip(v){
  var n=parseFloat(String(v).replace(/[^\d.]/g,''));
  if(isNaN(n)) return '<span class="g-chip" style="background:#f5ede3;color:#7a5a48">'+v+'</span>';
  var c=n>=90?'gc-ex':n>=75?'gc-vg':n>=65?'gc-gd':n>=50?'gc-ps':'gc-fl';
  return '<span class="g-chip '+c+'">'+v+'</span>';
}

// ── UI HELPERS ──
function showLoad(v){document.getElementById('loadingCard').style.display=v?'block':'none';}
function clearAll(){
  document.getElementById('errAlert').classList.remove('on');
  document.getElementById('warnAlert').classList.remove('on');
  document.getElementById('multiCard').classList.remove('on');
  document.getElementById('resCard').classList.remove('on');
  document.getElementById('sList').innerHTML='';
}
function showErr(m){document.getElementById('errMsg').textContent=m;document.getElementById('errAlert').classList.add('on');}
function showWarn(m){document.getElementById('warnMsg').textContent=m;document.getElementById('warnAlert').classList.add('on');}

function displayResult(rec){
  currentStudent=rec;
  var cm=rec._cm;
  var name   =cv(rec,cm.name)      ||'—';
  var seat   =cv(rec,cm.seat)      ||'—';
  var grade  =cv(rec,cm.grade)     ||currentGradeLabel;
  var section=cv(rec,cm.section)   ||'';
  var total  =cv(rec,cm.total)     ||'—';
  var pct    =formatPct(cv(rec,cm.percent))   ||'—';
  var glabel =cv(rec,cm.gradeLabel)||'—';
  var status =cv(rec,cm.status)    ||'—';
  var notes  =cv(rec,cm.notes)     ||'';

  document.getElementById('resName').textContent=name;
  document.getElementById('resSeat').textContent=seat;

  var badge=document.getElementById('resBadge');
  badge.textContent=status;
  var st=normAr(status);
  badge.className='st-pill '+(st.indexOf('ناجح')!==-1||st.indexOf('نجاح')!==-1?'pill-pass':
    st.indexOf('راسب')!==-1||st.indexOf('رسوب')!==-1?'pill-fail':'pill-other');

  var tiles=[
    {i:'fa-chalkboard-user',l:'الصف الدراسي',v:grade},
    {i:'fa-door-open',l:'الشعبة',v:section||'—'},
    {i:'fa-clipboard-check',l:'الحالة',v:status},
    {i:'fa-calculator',l:'المجموع',v:total,g:1},
    {i:'fa-percent',l:'النسبة المئوية',v:pct,g:1},
    {i:'fa-star',l:'التقدير',v:glabel,g:1},
  ];
  document.getElementById('infoGrid').innerHTML=tiles.map(function(d,idx){
    return '<div class="i-tile'+(d.g?' gold':'')+'" style="animation-delay:'+(0.05*(idx+1))+'s">'
      +'<div class="t-icon"><i class="fas '+d.i+'"></i></div>'
      +'<div class="t-label">'+d.l+'</div>'
      +'<div class="t-val">'+d.v+'</div></div>';
  }).join('');

  var tbody=document.getElementById('gradesBody');
  tbody.innerHTML='';
  if(cm.subjects.length>0){
    cm.subjects.forEach(function(sub,idx){
      var v=cv(rec,sub.idx)||'—';
      var tr=document.createElement('tr');
      tr.style.animationDelay=(0.04*idx)+'s';
      tr.innerHTML='<td>'+sub.name+'</td><td>'+gradeChip(v)+'</td>';
      tbody.appendChild(tr);
    });
    document.getElementById('gradesSec').style.display='';
  } else {
    document.getElementById('gradesSec').style.display='none';
  }

  if(notes){
    document.getElementById('notesText').textContent=notes;
    document.getElementById('notesArea').style.display='flex';
  } else {
    document.getElementById('notesArea').style.display='none';
  }

  document.getElementById('resCard').classList.add('on');
  setTimeout(function(){document.getElementById('resCard').scrollIntoView({behavior:'smooth',block:'nearest'});},120);
}

function handleSearch(){
  clearAll();
  var g=document.getElementById('gradeSelect').value;
  var q=document.getElementById('searchInput').value.trim();
  if(!g){showErr('الرجاء اختيار الصف الدراسي أولًا.');return;}
  if(!q){showErr('الرجاء إدخال رقم الجلوس أو اسم الطالب.');return;}
  currentGradeLabel=g==='1'?'الصف الأول الثانوي':'الصف الثاني الثانوي';
  showLoad(true);
  loadExcel(g).then(function(records){
    showLoad(false);
    var res=searchRecs(records,q);
    if(res.length===0){
      showWarn('لم يتم العثور على نتيجة. تأكد من صحة رقم الجلوس أو الاسم.');
    } else if(res.length===1){
      displayResult(res[0]);
    } else {
      var list=document.getElementById('sList');
      res.forEach(function(rec,idx){
        var cm=rec._cm;
        var name=cv(rec,cm.name)||'—';
        var seat=cv(rec,cm.seat)||'—';
        var sec=cv(rec,cm.section)||'';
        var div=document.createElement('div');
        div.className='s-item';
        div.innerHTML='<div class="si-av"><i class="fas fa-user"></i></div>'
          +'<div class="si-inf"><div class="si-name">'+name+'</div>'
          +'<div class="si-meta"><i class="fas fa-hashtag" style="margin-left:3px;color:var(--brick)"></i>رقم الجلوس: '+seat+(sec?' &nbsp;|&nbsp; الشعبة: '+sec:'')+'</div></div>'
          +'<button class="btn-sm" onclick="selStudent('+idx+')"><i class="fas fa-eye" style="margin-left:5px"></i>عرض</button>';
        list.appendChild(div);
      });
      window._multi=res;
      document.getElementById('multiCard').classList.add('on');
    }
  }).catch(function(err){
    showLoad(false);
    showErr('خطأ في تحميل البيانات: '+(err.message||String(err)));
  });
}

function selStudent(idx){
  document.getElementById('multiCard').classList.remove('on');
  displayResult(window._multi[idx]);
}

function newSearch(){
  clearAll();
  document.getElementById('searchInput').value='';
  document.getElementById('gradeSelect').value='';
  currentStudent=null;
  window.scrollTo({top:0,behavior:'smooth'});
}

document.getElementById('searchInput').addEventListener('keydown',function(e){if(e.key==='Enter')handleSearch();});

// ── PRINT RESULT ──
function printResult(){
  if(!currentStudent) return;
  var rec=currentStudent,cm=rec._cm;
  var name   =cv(rec,cm.name)      ||'—';
  var seat   =cv(rec,cm.seat)      ||'—';
  var grade  =cv(rec,cm.grade)     ||currentGradeLabel;
  var section=cv(rec,cm.section)   ||'—';
  var total  =cv(rec,cm.total)     ||'—';
  var pct    =formatPct(cv(rec,cm.percent)) ||'—';
  var glabel =cv(rec,cm.gradeLabel)||'—';
  var status =cv(rec,cm.status)    ||'—';
  var notes  =cv(rec,cm.notes)     ||'';
  var today  =new Date().toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'});
  var isPass =normAr(status).indexOf('ناجح')!==-1||normAr(status).indexOf('نجاح')!==-1;

  var rows='';
  cm.subjects.forEach(function(sub,i){
    var v=cv(rec,sub.idx)||'—';
    rows+='<tr style="background:'+(i%2===0?'#fdf6ef':'#fff')+'">'
      +'<td style="text-align:right;padding:5px 10px;font-weight:700;border:1px solid #e8d5b7;color:#3b1a0e;font-size:.8rem">'+sub.name+'</td>'
      +'<td style="text-align:center;padding:5px 10px;border:1px solid #e8d5b7;font-weight:800;color:#7a3e2a;font-size:.8rem">'+v+'</td>'
      +'</tr>';
  });

  var html='<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">'
    +'<title>نتيجة الطالب</title>'
    +'<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800;900&display=swap" rel="stylesheet">'
    +'<style>'
    +'*{box-sizing:border-box;margin:0;padding:0}'
    +'html,body{font-family:Tajawal,sans-serif;direction:rtl;background:#fff}'
    +'@page{size:A4 portrait;margin:8mm}'
    +'body{padding:0;margin:0}'
    +'.bar{height:5px;background:linear-gradient(90deg,#8c3318,#b94a28,#d4923a);margin-bottom:10px}'
    +'.top{text-align:center;margin-bottom:10px}'
    +'.doc-title{font-size:1.3rem;font-weight:900;color:#3b1a0e;margin-bottom:2px}'
    +'.sub{font-size:.75rem;color:#7a5a48;font-weight:600}'
    +'.div{width:50px;height:2px;background:linear-gradient(90deg,#b94a28,#d4923a);margin:5px auto 10px;border-radius:2px}'
    +'.ig{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}'
    +'.ii{background:#fdf6ef;border:1px solid #e8d5b7;border-radius:6px;padding:6px 10px}'
    +'.ii.full{grid-column:span 2}'
    +'.ii label{font-size:.66rem;color:#b94a28;font-weight:700;display:block;margin-bottom:1px}'
    +'.ii span{font-size:.85rem;font-weight:800;color:#3b1a0e}'
    +'.st{color:'+(isPass?'#1a6b3a':'#b94a28')+'!important}'
    +'.st-title{font-size:.8rem;font-weight:800;color:#3b1a0e;margin-bottom:5px;padding-bottom:4px;border-bottom:1.5px solid #e8d5b7}'
    +'table{width:100%;border-collapse:collapse;margin-bottom:8px;border:1px solid #e8d5b7;page-break-inside:auto}'
    +'tr{page-break-inside:avoid}'
    +'.sign{display:flex;justify-content:space-between;margin-top:16px}'
    +'.sc{text-align:center;width:160px}'
    +'.sl{border-top:1px solid #c8a888;padding-top:4px;font-size:.7rem;color:#7a5a48;font-weight:700;margin-top:36px}'
    +'.dt{text-align:center;font-size:.68rem;color:#b08878;margin-top:8px}'
    +'.bb{height:3px;background:linear-gradient(90deg,#8c3318,#b94a28,#d4923a);margin-top:10px}'
    +'</style></head><body>'
    +'<div class="bar"></div>'
    +'<div class="top">'
    +'<div style="font-size:1.8rem;margin-bottom:3px">&#127891;</div>'
    +'<div class="doc-title">بيان نتيجة طالب</div>'
    +'<div class="sub">الفاروق الثانوية بنين &mdash; وزارة التربية والتعليم</div>'
    +'<div class="div"></div></div>'
    +'<div class="ig">'
    +'<div class="ii full"><label>اسم الطالب</label><span style="font-size:1rem">'+name+'</span></div>'
    +'<div class="ii"><label>رقم الجلوس</label><span>'+seat+'</span></div>'
    +'<div class="ii"><label>الصف الدراسي</label><span>'+grade+'</span></div>'
    +'<div class="ii"><label>الشعبة</label><span>'+section+'</span></div>'
    +'<div class="ii"><label>الحالة</label><span class="st">'+status+'</span></div>'
    +'<div class="ii"><label>المجموع</label><span>'+total+'</span></div>'
    +'<div class="ii"><label>النسبة</label><span>'+pct+'</span></div>'
    +'<div class="ii"><label>التقدير</label><span>'+glabel+'</span></div>'
    +'</div>';

  if(cm.subjects.length>0){
    html+='<div class="st-title">جدول المواد والدرجات</div>'
      +'<table>'
      +'<thead><tr style="background:linear-gradient(135deg,#8c3318,#b94a28);color:#fff">'
      +'<th style="padding:6px 10px;text-align:right;font-size:.75rem">المادة</th>'
      +'<th style="padding:6px 10px;text-align:center;font-size:.75rem">الدرجة</th>'
      +'</tr></thead><tbody>'+rows+'</tbody></table>';
  }
  if(notes) html+='<div style="background:#fdf6ef;border:1px solid #e8d5b7;border-radius:6px;padding:7px 12px;font-size:.76rem;color:#7a4800;font-weight:600;margin-bottom:6px"><strong>ملاحظات: </strong>'+notes+'</div>';
