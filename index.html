
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة نتائج الطلاب مدرسة الفاروق الثانوية بنين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root {
  --primary: #6c63ff;
  --primary-light: #8b85ff;
  --primary-dark: #5046e4;
  --secondary: #ff6584;
  --accent: #43d9ad;
  --accent2: #ffc65c;
  --bg: #f0f2ff;
  --bg2: #ffffff;
  --surface: rgba(255,255,255,0.85);
  --surface2: rgba(255,255,255,0.6);
  --text: #2d2f6b;
  --text2: #6b6f9e;
  --text3: #a0a5c9;
  --border: rgba(108,99,255,0.13);
  --shadow-sm: 0 4px 20px rgba(108,99,255,0.08);
  --shadow: 0 8px 40px rgba(108,99,255,0.13);
  --shadow-lg: 0 20px 60px rgba(108,99,255,0.18);
  --radius: 20px;
  --radius-sm: 12px;
  --radius-xs: 8px;
}

*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
  font-family:'Tajawal',sans-serif;
  background:var(--bg);
  min-height:100vh;
  direction:rtl;
  overflow-x:hidden;
}

/* ── ANIMATED BACKGROUND ── */
.bg-blobs{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
}
.blob{
  position:absolute;
  border-radius:50%;
  filter:blur(80px);
  opacity:0.35;
  animation:blobFloat 10s ease-in-out infinite alternate;
}
.blob-1{width:500px;height:500px;background:radial-gradient(circle,#a78bfa,#6c63ff);top:-150px;right:-100px;animation-delay:0s;}
.blob-2{width:400px;height:400px;background:radial-gradient(circle,#fbc2eb,#ff6584);bottom:-100px;left:-80px;animation-delay:-4s;}
.blob-3{width:350px;height:350px;background:radial-gradient(circle,#a1c4fd,#43d9ad);top:40%;right:20%;animation-delay:-7s;}
@keyframes blobFloat{
  from{transform:translate(0,0) scale(1);}
  to{transform:translate(30px,20px) scale(1.07);}
}

/* ── PARTICLES ── */
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;}
.particle{
  position:absolute;
  width:6px;height:6px;
  background:var(--primary);
  border-radius:50%;
  opacity:0;
  animation:particleFly 8s linear infinite;
}
@keyframes particleFly{
  0%{transform:translateY(100vh) scale(0);opacity:0;}
  10%{opacity:0.4;}
  90%{opacity:0.1;}
  100%{transform:translateY(-20vh) scale(1);opacity:0;}
}

/* ── CONTENT WRAPPER ── */
.page-wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}

/* ── HEADER ── */
header{
  padding:24px 24px 0;
  text-align:center;
  animation:slideDown .7s cubic-bezier(.22,1,.36,1) both;
}
@keyframes slideDown{from{transform:translateY(-40px);opacity:0;}to{transform:translateY(0);opacity:1;}}

.header-glass{
  display:inline-flex;
  align-items:center;
  gap:16px;
  background:var(--surface);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1.5px solid var(--border);
  border-radius:60px;
  padding:14px 30px;
  box-shadow:var(--shadow);
}
.header-icon{
  width:52px;height:52px;
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;color:#fff;
  box-shadow:0 8px 20px rgba(108,99,255,0.35);
  animation:pulse 3s ease-in-out infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 8px 20px rgba(108,99,255,.35);}50%{box-shadow:0 8px 32px rgba(108,99,255,.6);}}
.header-title h1{
  font-size:1.35rem;font-weight:900;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1.2;
}
.header-title p{font-size:.78rem;color:var(--text2);font-weight:500;margin-top:2px;}

/* ── YEAR BADGE ── */
.year-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:#fff;
  border-radius:30px;
  padding:5px 16px;
  font-size:.75rem;font-weight:700;
  margin-top:14px;
  box-shadow:0 4px 14px rgba(108,99,255,.3);
  animation:fadeIn .8s .3s both;
}
@keyframes fadeIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}

/* ── MAIN ── */
main{
  flex:1;
  max-width:860px;
  margin:0 auto;
  width:100%;
  padding:32px 20px 60px;
  display:flex;
  flex-direction:column;
  gap:24px;
}

/* ── GLASS CARD ── */
.glass-card{
  background:var(--surface);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
  animation:cardIn .6s cubic-bezier(.22,1,.36,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}

.card-head{
  padding:20px 24px;
  display:flex;align-items:center;gap:12px;
  border-bottom:1.5px solid var(--border);
  background:rgba(255,255,255,.5);
}
.card-head-icon{
  width:40px;height:40px;
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;color:#fff;
  box-shadow:0 4px 12px rgba(108,99,255,.3);
  flex-shrink:0;
}
.card-head h2{font-size:1rem;font-weight:800;color:var(--text);}
.card-head-icon.accent{background:linear-gradient(135deg,var(--accent),#2ecc71);}
.card-body{padding:28px 24px;}

/* ── FORM ── */
.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-bottom:22px;
}
.form-group{display:flex;flex-direction:column;gap:8px;}
.form-label{
  font-size:.83rem;font-weight:700;color:var(--text);
  display:flex;align-items:center;gap:6px;
}
.form-label i{color:var(--primary);}
.form-control{
  background:rgba(255,255,255,.9);
  border:2px solid rgba(108,99,255,.12);
  border-radius:var(--radius-sm);
  padding:13px 16px;
  font-family:'Tajawal',sans-serif;
  font-size:.95rem;
  color:var(--text);
  outline:none;
  direction:rtl;
  width:100%;
  transition:all .25s;
  box-shadow:0 2px 10px rgba(0,0,0,.04);
}
.form-control:focus{
  border-color:var(--primary);
  background:#fff;
  box-shadow:0 0 0 4px rgba(108,99,255,.12),0 2px 10px rgba(0,0,0,.04);
  transform:translateY(-1px);
}
.form-control::placeholder{color:var(--text3);}

/* ── SEARCH BUTTON ── */
.btn-search{
  width:100%;
  padding:15px;
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:#fff;
  border:none;
  border-radius:var(--radius-sm);
  font-family:'Tajawal',sans-serif;
  font-size:1.05rem;
  font-weight:800;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:all .25s;
  box-shadow:0 8px 24px rgba(108,99,255,.35);
  position:relative;
  overflow:hidden;
  letter-spacing:.3px;
}
.btn-search::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);
  opacity:0;transition:opacity .25s;
}
.btn-search:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(108,99,255,.45);}
.btn-search:hover::before{opacity:1;}
.btn-search:active{transform:translateY(0);}
.btn-search i{font-size:1rem;}

/* ── LOADING ── */
.loading-card{
  display:none;
  text-align:center;
  padding:40px 24px;
}
.loading-card.visible{display:block;}
.loading-ring{
  width:56px;height:56px;
  border:4px solid rgba(108,99,255,.15);
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-card p{color:var(--text2);font-size:.95rem;font-weight:600;}
.loading-dots span{
  display:inline-block;
  width:6px;height:6px;
  background:var(--primary);
  border-radius:50%;
  margin:0 2px;
  animation:dot .8s ease-in-out infinite;
}
.loading-dots span:nth-child(2){animation-delay:.15s;}
.loading-dots span:nth-child(3){animation-delay:.3s;}
@keyframes dot{0%,80%,100%{transform:scale(0);}40%{transform:scale(1);}}

/* ── ALERTS ── */
.alert{
  display:none;
  align-items:center;
  gap:12px;
  padding:16px 20px;
  border-radius:var(--radius-sm);
  font-size:.92rem;font-weight:600;
  animation:cardIn .35s both;
}
.alert.visible{display:flex;}
.alert-error{background:linear-gradient(135deg,#fff5f5,#ffe8e8);border:1.5px solid #ffc5c5;color:#d63031;}
.alert-warning{background:linear-gradient(135deg,#fffbf0,#fff3d4);border:1.5px solid #ffe08a;color:#b8740a;}
.alert i{font-size:1.1rem;flex-shrink:0;}

/* ── MULTI RESULTS ── */
.multi-card{display:none;animation:cardIn .5s both;}
.multi-card.visible{display:block;}
.student-list{padding:8px 0;}
.student-item{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:16px 24px;
  border-bottom:1.5px solid var(--border);
  transition:background .2s;
  cursor:pointer;
}
.student-item:last-child{border-bottom:none;}
.student-item:hover{background:rgba(108,99,255,.04);}
.si-avatar{
  width:42px;height:42px;
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#fff;
  flex-shrink:0;
  box-shadow:0 4px 10px rgba(108,99,255,.25);
}
.si-info{flex:1;}
.si-name{font-weight:800;color:var(--text);font-size:.95rem;margin-bottom:2px;}
.si-meta{font-size:.78rem;color:var(--text2);}
.btn-sm{
  padding:8px 18px;
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:#fff;
  border:none;
  border-radius:30px;
  font-family:'Tajawal',sans-serif;
  font-size:.82rem;font-weight:700;
  cursor:pointer;
  white-space:nowrap;
  transition:all .2s;
  box-shadow:0 4px 12px rgba(108,99,255,.25);
  flex-shrink:0;
}
.btn-sm:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(108,99,255,.35);}

/* ── RESULT CARD ── */
.result-card{display:none;animation:cardIn .5s cubic-bezier(.22,1,.36,1) both;}
.result-card.visible{display:block;}

.result-hero{
  padding:32px 28px 28px;
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 50%,#a78bfa 100%);
  position:relative;
  overflow:hidden;
}
.result-hero::before{
  content:'';position:absolute;inset:0;
  background:url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='40' cy='40' r='38' fill='none' stroke='rgba(255,255,255,.06)' stroke-width='2'/%3E%3Ccircle cx='40' cy='40' r='25' fill='none' stroke='rgba(255,255,255,.05)' stroke-width='2'/%3E%3C/svg%3E") center/200px repeat;
}
.result-hero-inner{position:relative;z-index:1;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.result-avatar{
  width:72px;height:72px;
  background:rgba(255,255,255,.2);
  backdrop-filter:blur(10px);
  border:2px solid rgba(255,255,255,.4);
  border-radius:24px;
  display:flex;align-items:center;justify-content:center;
  font-size:32px;color:#fff;
  flex-shrink:0;
  animation:avatarIn .6s .2s cubic-bezier(.22,1,.36,1) both;
}
@keyframes avatarIn{from{transform:scale(0) rotate(-20deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
.result-info{flex:1;}
.result-name{font-size:1.6rem;font-weight:900;color:#fff;line-height:1.2;margin-bottom:4px;}
.result-seat{font-size:.85rem;color:rgba(255,255,255,.75);font-weight:600;}
.result-seat i{margin-left:4px;}
.status-pill{
  padding:8px 20px;
  border-radius:30px;
  font-size:.88rem;font-weight:800;
  flex-shrink:0;
  animation:fadeIn .5s .3s both;
}
.pill-pass{background:rgba(67,217,173,.2);border:1.5px solid rgba(67,217,173,.5);color:#43d9ad;}
.pill-fail{background:rgba(255,101,132,.2);border:1.5px solid rgba(255,101,132,.5);color:#ff9ab0;}
.pill-other{background:rgba(255,198,92,.2);border:1.5px solid rgba(255,198,92,.5);color:#ffd880;}

.result-body{padding:28px;}

/* ── INFO GRID ── */
.info-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:28px;
}
.info-tile{
  background:rgba(255,255,255,.9);
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  padding:16px 14px;
  text-align:center;
  transition:all .25s;
  position:relative;
  overflow:hidden;
  animation:tileIn .5s cubic-bezier(.22,1,.36,1) both;
}
.info-tile:nth-child(1){animation-delay:.05s;}
.info-tile:nth-child(2){animation-delay:.10s;}
.info-tile:nth-child(3){animation-delay:.15s;}
.info-tile:nth-child(4){animation-delay:.20s;}
.info-tile:nth-child(5){animation-delay:.25s;}
.info-tile:nth-child(6){animation-delay:.30s;}
@keyframes tileIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.info-tile:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
.info-tile::after{
  content:'';
  position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--primary),var(--primary-light));
  transform:scaleX(0);transition:transform .25s;
  transform-origin:right;
}
.info-tile:hover::after{transform:scaleX(1);}
.info-tile.gold::after{background:linear-gradient(90deg,#f59e0b,var(--accent2));}
.tile-icon{font-size:1.4rem;color:var(--primary);margin-bottom:6px;}
.info-tile.gold .tile-icon{color:#d97706;}
.tile-label{font-size:.72rem;color:var(--text3);font-weight:700;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
.tile-val{font-size:1.1rem;font-weight:800;color:var(--text);}
.info-tile.gold .tile-val{font-size:1.25rem;color:#b45309;}

/* ── GRADES TABLE ── */
.section-head{
  display:flex;align-items:center;gap:10px;
  margin-bottom:16px;
  font-size:.95rem;font-weight:800;color:var(--text);
}
.section-head::after{
  content:'';flex:1;height:2px;
  background:linear-gradient(90deg,var(--border),transparent);
}
.section-head i{color:var(--primary);}

.table-scroll{overflow-x:auto;border-radius:var(--radius-sm);border:1.5px solid var(--border);}
.grades-table{
  width:100%;border-collapse:collapse;min-width:380px;
  font-size:.9rem;
}
.grades-table thead tr{background:linear-gradient(135deg,var(--primary),var(--primary-light));}
.grades-table thead th{
  padding:13px 18px;text-align:center;
  color:#fff;font-weight:700;font-size:.83rem;white-space:nowrap;
}
.grades-table tbody tr{
  border-bottom:1.5px solid var(--border);
  transition:background .15s;
  animation:rowIn .4s both;
}
@keyframes rowIn{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:translateX(0);}}
.grades-table tbody tr:last-child{border-bottom:none;}
.grades-table tbody tr:hover{background:rgba(108,99,255,.04);}
.grades-table tbody td{padding:12px 18px;text-align:center;color:var(--text2);}
.grades-table tbody td:first-child{font-weight:700;color:var(--text);text-align:right;}
.grade-chip{
  display:inline-block;padding:4px 12px;
  border-radius:20px;font-size:.82rem;font-weight:800;
}
.g-excellent{background:linear-gradient(135deg,#d1fae5,#a7f3d0);color:#065f46;}
.g-verygood {background:linear-gradient(135deg,#dbeafe,#bfdbfe);color:#1e40af;}
.g-good     {background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e;}
.g-pass     {background:linear-gradient(135deg,#ffedd5,#fed7aa);color:#9a3412;}
.g-fail     {background:linear-gradient(135deg,#fee2e2,#fecaca);color:#991b1b;}

.notes-box{
  background:linear-gradient(135deg,#fffbf0,#fff8e6);
  border:1.5px solid #ffe08a;
  border-radius:var(--radius-sm);
  padding:14px 18px;
  display:flex;gap:10px;align-items:flex-start;
  margin-top:20px;
  animation:cardIn .4s both;
}
.notes-box i{color:#d97706;flex-shrink:0;margin-top:2px;}
.notes-box p{font-size:.88rem;color:#92400e;font-weight:600;line-height:1.7;}

/* ── ACTION BUTTONS ── */
.action-row{
  display:flex;gap:12px;flex-wrap:wrap;
  padding:22px 28px;
  background:rgba(255,255,255,.6);
  border-top:1.5px solid var(--border);
}
.btn-act{
  flex:1;min-width:130px;
  padding:13px 16px;
  border:none;border-radius:var(--radius-sm);
  font-family:'Tajawal',sans-serif;
  font-size:.88rem;font-weight:800;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .25s;
  position:relative;overflow:hidden;
}
.btn-act::after{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);
  opacity:0;transition:opacity .25s;
}
.btn-act:hover::after{opacity:1;}
.btn-act:hover{transform:translateY(-2px);}
.btn-act:active{transform:translateY(0);}

.btn-print{
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:#fff;
  box-shadow:0 6px 20px rgba(108,99,255,.3);
}
.btn-print:hover{box-shadow:0 10px 28px rgba(108,99,255,.4);}
.btn-cert{
  background:linear-gradient(135deg,#f59e0b,var(--accent2));
  color:#fff;
  box-shadow:0 6px 20px rgba(245,158,11,.3);
}
.btn-cert:hover{box-shadow:0 10px 28px rgba(245,158,11,.4);}
.btn-new{
  background:rgba(108,99,255,.08);
  color:var(--primary);
  border:2px solid rgba(108,99,255,.2);
}
.btn-new:hover{background:rgba(108,99,255,.14);border-color:var(--primary);}

/* ── FOOTER ── */
footer{
  text-align:center;
  padding:20px;
  color:var(--text3);
  font-size:.78rem;
  position:relative;z-index:1;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(108,99,255,.25);border-radius:10px;}

/* ── RESPONSIVE ── */
@media(max-width:680px){
  .header-glass{padding:12px 20px;gap:12px;}
  .header-icon{width:42px;height:42px;font-size:20px;border-radius:12px;}
  .header-title h1{font-size:1.1rem;}
  .form-row{grid-template-columns:1fr;}
  .info-grid{grid-template-columns:repeat(2,1fr);}
  .result-name{font-size:1.2rem;}
  .action-row{flex-direction:column;padding:18px 20px;}
  .btn-act{width:100%;}
  .result-body{padding:20px 18px;}
  .card-body{padding:20px 18px;}
  main{padding:20px 14px 40px;}
}
@media(max-width:380px){
  .info-grid{grid-template-columns:1fr 1fr;}
  .result-avatar{width:56px;height:56px;font-size:26px;}
}
</style>
</head>
<body>

<!-- Animated background -->
<div class="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>
<div class="particles" id="particles"></div>

<div class="page-wrap">

  <!-- Header -->
  <header>
    <div class="header-glass">
      <div class="header-icon"><i class="fas fa-graduation-cap"></i></div>
      <div class="header-title">
        <h1>بوابة نتائج مدرسة الفاروق الثانوية بنين</h1>
        <p><i class="fas fa-shield-halved" style="margin-left:4px;color:var(--accent)"></i>نظام رسمي للاستعلام عن نتائج الطلاب</p>
      </div>

  <main>

    <!-- Search Card -->
    <div class="glass-card" style="animation-delay:.1s">

    <div class="alert alert-warning" id="warnAlert"><i class="fas fa-triangle-exclamation"></i><span id="warnMsg"></span></div>

    <!-- Multiple Results -->
    <div class="glass-card multi-card" id="multiResults">
      <div class="card-head">
        <div class="card-head-icon accent"><i class="fas fa-users"></i></div>
        <h2>تعددت نتائج البحث — اختر الطالب المطلوب</h2>
      </div>
      <div class="student-list" id="studentList"></div>
    </div>

    <!-- Result -->
    <div class="glass-card result-card" id="resultCard">

      <div class="result-hero">
        <div class="result-hero-inner">
          <div class="result-avatar"><i class="fas fa-user-graduate"></i></div>
          <div class="result-info">
            <div class="result-name" id="resName">—</div>
            <div class="result-seat"><i class="fas fa-hashtag"></i><span id="resSeat">—</span></div>
          </div>
          <div class="status-pill" id="resBadge">—</div>
        </div>
      </div>

      <div class="result-body">
        <div class="info-grid" id="infoGrid"></div>

        <div class="grades-section" id="gradesSection">
          <div class="section-head"><i class="fas fa-table-list"></i>جدول المواد والدرجات</div>
          <div class="table-scroll">
            <table class="grades-table">
              <thead><tr><th>المادة الدراسية</th><th>الدرجة</th></tr></thead>
              <tbody id="gradesBody"></tbody>
            </table>
          </div>
        </div>

        <div class="notes-box" id="notesArea" style="display:none">
          <i class="fas fa-note-sticky fa-lg"></i>
          <p id="notesText"></p>
        </div>

      <div class="action-row">
        <button class="btn-act btn-print" onclick="printResult()">
          <i class="fas fa-print"></i> طباعة النتيجة الرسمية
        </button>
        <button class="btn-act btn-cert" onclick="printCertificate()">
          <i class="fas fa-award"></i> طباعة شهادة التقدير
        </button>
        <button class="btn-act btn-new" onclick="newSearch()">
          <i class="fas fa-rotate-right"></i> استعلام جديد
        </button>

  </main>

  <footer>
    <i class="fas fa-lock" style="margin-left:5px;color:var(--primary)"></i>
    جميع الحقوق محفوظة &mdash; بوابة نتائج الطلاب &copy; <span id="footerYear"></span>
  </footer>
</div>

<script>
// ===== YEAR =====
var y = new Date().getFullYear();
document.getElementById('yearBadge').innerHTML = '<i class="fas fa-calendar-days" style="margin-left:5px"></i>العام الدراسي ' + y + ' / ' + (y+1);
document.getElementById('footerYear').textContent = y;

// ===== PARTICLES =====
(function(){
  var c = document.getElementById('particles');
  var colors = ['#6c63ff','#ff6584','#43d9ad','#ffc65c','#a78bfa'];
  for(var i=0;i<22;i++){
    var p=document.createElement('div');
    p.className='particle';
    p.style.cssText='left:'+Math.random()*100+'%;width:'+(4+Math.random()*6)+'px;height:'+(4+Math.random()*6)+'px;background:'+colors[Math.floor(Math.random()*colors.length)]+';animation-delay:'+Math.random()*8+'s;animation-duration:'+(6+Math.random()*6)+'s;opacity:.0;';
    c.appendChild(p);
  }
})();

// ===== GLOBALS =====
var cachedData = {};
var currentStudent = null;
var currentGradeLabel = '';

// ===== COLUMN KEYS =====
var COL_SEAT    = ['رقم الجلوس','رقم جلوس','رقم_الجلوس','جلوس','seat','seat_number','id','رقم'];
var COL_NAME    = ['اسم الطالب','اسم_الطالب','الاسم','اسم','name','student_name'];
var COL_GRADE   = ['الصف','صف','grade','class','level'];
var COL_SECTION = ['الشعبة','شعبة','القسم','قسم','section','class_section','division'];
var COL_TOTAL   = ['المجموع','مجموع','total','sum','إجمالي','اجمالي'];
var COL_PERCENT = ['النسبة','نسبة','النسبة المئوية','percent','percentage','rate','%'];
var COL_GLABEL  = ['التقدير','تقدير','grade_label','result_label','تقييم'];
var COL_STATUS  = ['الحالة','حالة','status','نتيجة','قرار','decision'];
var COL_NOTES   = ['ملاحظات','ملاحظة','notes','note','remarks','تعليق'];

function matchCol(h,keys){
  h=String(h).trim().toLowerCase().replace(/\s+/g,'');
  for(var i=0;i<keys.length;i++){
    var k=keys[i].toLowerCase().replace(/\s+/g,'');
    if(h===k||h.indexOf(k)!==-1) return true;
  }
  return false;
}

function detectColumns(headers){
  var m={seat:null,name:null,grade:null,section:null,total:null,percent:null,gradeLabel:null,status:null,notes:null,subjects:[]};
  headers.forEach(function(h,i){
    if(m.seat===null&&matchCol(h,COL_SEAT)){m.seat=i;return;}
    if(m.name===null&&matchCol(h,COL_NAME)){m.name=i;return;}
    if(m.grade===null&&matchCol(h,COL_GRADE)){m.grade=i;return;}
    if(m.section===null&&matchCol(h,COL_SECTION)){m.section=i;return;}
    if(m.total===null&&matchCol(h,COL_TOTAL)){m.total=i;return;}
    if(m.percent===null&&matchCol(h,COL_PERCENT)){m.percent=i;return;}
    if(m.gradeLabel===null&&matchCol(h,COL_GLABEL)){m.gradeLabel=i;return;}
    if(m.status===null&&matchCol(h,COL_STATUS)){m.status=i;return;}
    if(m.notes===null&&matchCol(h,COL_NOTES)){m.notes=i;return;}
  });
  var used=Object.values(m).filter(function(v){return typeof v==='number';});
  headers.forEach(function(h,i){
    if(used.indexOf(i)===-1&&h&&String(h).trim()!=='')
      m.subjects.push({idx:i,name:String(h).trim()});
  });
  return m;
}

function normalizeAr(s){
  return String(s||'')
    .replace(/[أإآا]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')
    .replace(/\s+/g,' ').trim().toLowerCase();
}
function convNums(s){
  return String(s).replace(/[٠١٢٣٤٥٦٧٨٩]/g,function(c){return c.charCodeAt(0)-1632;});
}

function loadExcel(g){
  return new Promise(function(res,rej){
    if(cachedData[g]){res(cachedData[g]);return;}
    fetch(g==='1'?'./1sanawe.xlsx':'./2sanawe.xlsx')
      .then(function(r){if(!r.ok)throw new Error('تعذّر تحميل ملف البيانات ('+r.status+')');return r.arrayBuffer();})
      .then(function(buf){
        var wb=XLSX.read(buf,{type:'array'});
        var ws=wb.Sheets[wb.SheetNames[0]];
        var raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        if(!raw||raw.length<2) throw new Error('الملف فارغ أو لا يحتوي على بيانات');
        var hr=0;
        for(var i=0;i<Math.min(5,raw.length);i++){if(raw[i].filter(function(c){return c!=='';}).length>2){hr=i;break;}}
        var headers=raw[hr].map(function(c){return String(c).trim();});
        var cm=detectColumns(headers);
        var records=[];
        for(var r=hr+1;r<raw.length;r++){
          var row=raw[r];
          if(row.every(function(c){return c===''||c===null||c===undefined;})) continue;
          records.push({_headers:headers,_colMap:cm,_raw:row});
        }
        cachedData[g]=records;
        res(records);
      }).catch(rej);
  });
}

function cellVal(rec,idx){
  if(idx===null||idx===undefined) return '';
  return rec._raw[idx]!==undefined?String(rec._raw[idx]).trim():'';
}

function searchRecords(records,query){
  query=convNums(query.trim());
  var isNum=/^\d+$/.test(query);
  var nq=normalizeAr(query);
  return records.filter(function(rec){
    var cm=rec._colMap;
    if(isNum) return convNums(cellVal(rec,cm.seat))===query;
    return normalizeAr(cellVal(rec,cm.name)).indexOf(nq)!==-1;
  });
}

function gradeChip(v){
  var n=parseFloat(String(v).replace(/[^\d.]/g,''));
  if(isNaN(n)) return '<span class="grade-chip" style="background:#f3f4f6;color:#6b7280">'+v+'</span>';
  var cls=n>=90?'g-excellent':n>=75?'g-verygood':n>=65?'g-good':n>=50?'g-pass':'g-fail';
  return '<span class="grade-chip '+cls+'">'+v+'</span>';
}

// ===== UI =====
function showLoading(v){
  document.getElementById('loadingCard').style.display=v?'block':'none';
}
function clearStatus(){
  document.getElementById('errorAlert').classList.remove('visible');
  document.getElementById('warnAlert').classList.remove('visible');
  document.getElementById('multiResults').classList.remove('visible');
  document.getElementById('resultCard').classList.remove('visible');
  document.getElementById('studentList').innerHTML='';
}
function showError(m){document.getElementById('errorMsg').textContent=m;document.getElementById('errorAlert').classList.add('visible');}
function showWarn(m){document.getElementById('warnMsg').textContent=m;document.getElementById('warnAlert').classList.add('visible');}

function displayResult(rec){
  currentStudent=rec;
  var cm=rec._colMap;
  var name   =cellVal(rec,cm.name)      ||'—';
  var seat   =cellVal(rec,cm.seat)      ||'—';
  var grade  =cellVal(rec,cm.grade)     ||currentGradeLabel;
  var section=cellVal(rec,cm.section)   ||'';
  var total  =cellVal(rec,cm.total)     ||'—';
  var pct    =cellVal(rec,cm.percent)   ||'—';
  var glabel =cellVal(rec,cm.gradeLabel)||'—';
  var status =cellVal(rec,cm.status)    ||'—';
  var notes  =cellVal(rec,cm.notes)     ||'';

  document.getElementById('resName').textContent=name;
  document.getElementById('resSeat').textContent=seat;

  var badge=document.getElementById('resBadge');
  badge.textContent=status;
  var st=normalizeAr(status);
  badge.className='status-pill '+(st.indexOf('ناجح')!==-1||st.indexOf('نجاح')!==-1?'pill-pass':st.indexOf('راسب')!==-1||st.indexOf('رسوب')!==-1?'pill-fail':'pill-other');

  var tiles=[
    {i:'fa-chalkboard-user',l:'الصف الدراسي',v:grade,g:false},
    {i:'fa-door-open',l:'الشعبة',v:section||'—',g:false},
    {i:'fa-clipboard-check',l:'الحالة',v:status,g:false},
    {i:'fa-calculator',l:'المجموع',v:total,g:true},
    {i:'fa-percent',l:'النسبة المئوية',v:pct,g:true},
    {i:'fa-star',l:'التقدير',v:glabel,g:true},
  ];
  document.getElementById('infoGrid').innerHTML=tiles.map(function(d,idx){
    return '<div class="info-tile'+(d.g?' gold':'')+'" style="animation-delay:'+(0.05*(idx+1))+'s">'
      +'<div class="tile-icon"><i class="fas '+d.i+'"></i></div>'
      +'<div class="tile-label">'+d.l+'</div>'
      +'<div class="tile-val">'+d.v+'</div>'
      +'</div>';
  }).join('');

  var tbody=document.getElementById('gradesBody');
  tbody.innerHTML='';
  if(cm.subjects.length>0){
    cm.subjects.forEach(function(sub,idx){
      var v=cellVal(rec,sub.idx)||'—';
      var tr=document.createElement('tr');
      tr.style.animationDelay=(0.04*idx)+'s';
      tr.innerHTML='<td>'+sub.name+'</td><td>'+gradeChip(v)+'</td>';
      tbody.appendChild(tr);
    });
    document.getElementById('gradesSection').style.display='';
  } else {
    document.getElementById('gradesSection').style.display='none';
  }

  if(notes){
    document.getElementById('notesText').textContent=notes;
    document.getElementById('notesArea').style.display='flex';
  } else {
    document.getElementById('notesArea').style.display='none';
  }

  document.getElementById('resultCard').classList.add('visible');
  setTimeout(function(){document.getElementById('resultCard').scrollIntoView({behavior:'smooth',block:'nearest'});},100);
}

function handleSearch(){
  clearStatus();
  var g=document.getElementById('gradeSelect').value;
  var q=document.getElementById('searchInput').value.trim();
  if(!g){showError('الرجاء اختيار الصف الدراسي أولًا.');return;}
  if(!q){showError('الرجاء إدخال رقم الجلوس أو اسم الطالب.');return;}
  currentGradeLabel=g==='1'?'الصف الأول الثانوي':'الصف الثاني الثانوي';
  showLoading(true);
  loadExcel(g).then(function(records){
    showLoading(false);
    var res=searchRecords(records,q);
    if(res.length===0){
      showWarn('لم يتم العثور على نتيجة للبيانات المُدخلة. تأكد من صحة رقم الجلوس أو الاسم.');
    } else if(res.length===1){
      displayResult(res[0]);
    } else {
      var list=document.getElementById('studentList');
      res.forEach(function(rec,idx){
        var cm=rec._colMap;
        var name=cellVal(rec,cm.name)||'—';
        var seat=cellVal(rec,cm.seat)||'—';
        var section=cellVal(rec,cm.section)||'';
        var div=document.createElement('div');
        div.className='student-item';
        div.style.animationDelay=(0.05*idx)+'s';
        div.innerHTML='<div class="si-avatar"><i class="fas fa-user"></i></div>'
          +'<div class="si-info"><div class="si-name">'+name+'</div>'
          +'<div class="si-meta"><i class="fas fa-hashtag" style="margin-left:3px;color:var(--primary)"></i>رقم الجلوس: '+seat+(section?' &nbsp;|&nbsp; الشعبة: '+section:'')+'</div></div>'
          +'<button class="btn-sm" onclick="selectStudent('+idx+')"><i class="fas fa-eye" style="margin-left:5px"></i>عرض</button>';
        list.appendChild(div);
      });
      window._multi=res;
      document.getElementById('multiResults').classList.add('visible');
    }
  }).catch(function(err){
    showLoading(false);
    showError('خطأ في تحميل البيانات: '+(err.message||String(err)));
  });
}

function selectStudent(idx){
  document.getElementById('multiResults').classList.remove('visible');
  displayResult(window._multi[idx]);
}

function newSearch(){
  clearStatus();
  document.getElementById('searchInput').value='';
  document.getElementById('gradeSelect').value='';
  currentStudent=null;
  window.scrollTo({top:0,behavior:'smooth'});
}

document.getElementById('searchInput').addEventListener('keydown',function(e){if(e.key==='Enter')handleSearch();});

// ===== PRINT RESULT =====
function printResult(){
  if(!currentStudent) return;
  var rec=currentStudent,cm=rec._colMap;
  var name   =cellVal(rec,cm.name)      ||'—';
  var seat   =cellVal(rec,cm.seat)      ||'—';
  var grade  =cellVal(rec,cm.grade)     ||currentGradeLabel;
  var section=cellVal(rec,cm.section)   ||'—';
  var total  =cellVal(rec,cm.total)     ||'—';
  var pct    =cellVal(rec,cm.percent)   ||'—';
  var glabel =cellVal(rec,cm.gradeLabel)||'—';
  var status =cellVal(rec,cm.status)    ||'—';
  var notes  =cellVal(rec,cm.notes)     ||'';
  var today  =new Date().toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'});

  var rows='';
  cm.subjects.forEach(function(sub,i){
    var v=cellVal(rec,sub.idx)||'—';
    rows+='<tr style="background:'+(i%2===0?'#f8f9fa':'#fff')+'"><td style="text-align:right;padding:10px 16px;font-weight:700;border:1px solid #e5e7eb;color:#1e1b4b">'+sub.name+'</td><td style="text-align:center;padding:10px 16px;border:1px solid #e5e7eb;font-weight:800;color:#4c1d95">'+v+'</td></tr>';
  });

  var isPass=normalizeAr(status).indexOf('ناجح')!==-1||normalizeAr(status).indexOf('نجاح')!==-1;
  var html='<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">'
    +'<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800;900&display=swap" rel="stylesheet">'
    +'<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Tajawal,sans-serif;direction:rtl;background:#fff}'
    +'@media print{@page{size:A4 portrait;margin:12mm}}'
    +'.page{max-width:210mm;margin:0 auto;padding:16mm 16mm}'
    +'.bar{height:7px;background:linear-gradient(90deg,#6c63ff,#a78bfa,#ff6584);border-radius:4px;margin-bottom:18px}'
    +'.top{text-align:center;margin-bottom:20px}'
    +'.logo{font-size:2.5rem;margin-bottom:6px}span.grad{background:linear-gradient(135deg,#6c63ff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}'
    +'.doc-title{font-size:1.7rem;font-weight:900;color:#1e1b4b;margin-bottom:4px}'
    +'.divider{width:60px;height:3px;background:linear-gradient(90deg,#6c63ff,#ff6584);margin:8px auto 18px;border-radius:2px}'
    +'.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}'
    +'.info-item{background:#f5f3ff;border:1.5px solid #ede9fe;border-radius:8px;padding:10px 14px}'
    +'.info-item.full{grid-column:span 2}'
    +'.info-item label{font-size:.72rem;color:#7c3aed;font-weight:700;display:block;margin-bottom:2px}'
    +'.info-item span{font-size:.97rem;font-weight:800;color:#1e1b4b}'
    +'.status-span{font-size:1.05rem!important;color:'+(isPass?'#059669':'#dc2626')+'!important}'
    +'.sub-title{font-size:.92rem;font-weight:800;color:#1e1b4b;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid #ede9fe}'
    +'.sign{display:flex;justify-content:space-between;margin-top:32px}'
    +'.sign-box{text-align:center;width:180px}'
    +'.sign-line{border-top:1.5px solid #aaa;padding-top:6px;font-size:.78rem;color:#666;font-weight:700;margin-top:48px}'
    +'.date{text-align:center;font-size:.76rem;color:#999;margin-top:12px}'
    +'.bot-bar{height:4px;background:linear-gradient(90deg,#6c63ff,#a78bfa,#ff6584);border-radius:2px;margin-top:20px}'
    +'</style></head><body><div class="page">'
    +'<div class="bar"></div>'
    +'<div class="top"><div class="logo">&#127891;</div>'
    +'<div class="doc-title">بيان نتيجة طالب</div>'
    +'<div style="font-size:.82rem;color:#6b7280;font-weight:600">وزارة التربية والتعليم &mdash; نتيجة رسمية معتمدة</div>'
    +'<div class="divider"></div></div>'
    +'<div class="info-grid">'
    +'<div class="info-item full"><label>اسم الطالب</label><span style="font-size:1.15rem">'+name+'</span></div>'
    +'<div class="info-item"><label>رقم الجلوس</label><span>'+seat+'</span></div>'
    +'<div class="info-item"><label>الصف الدراسي</label><span>'+grade+'</span></div>'
    +'<div class="info-item"><label>الشعبة</label><span>'+section+'</span></div>'
    +'<div class="info-item"><label>الحالة</label><span class="status-span">'+status+'</span></div>'
    +'<div class="info-item"><label>المجموع الكلي</label><span>'+total+'</span></div>'
    +'<div class="info-item"><label>النسبة المئوية</label><span>'+pct+'</span></div>'
    +'<div class="info-item"><label>التقدير</label><span>'+glabel+'</span></div>'
    +'</div>';

  if(cm.subjects.length>0){
    html+='<div class="sub-title">جدول المواد والدرجات</div>'
      +'<table style="width:100%;border-collapse:collapse;margin-bottom:14px;border:1px solid #ede9fe">'
      +'<thead><tr style="background:linear-gradient(135deg,#6c63ff,#a78bfa);color:#fff">'
      +'<th style="padding:10px 16px;text-align:right;font-size:.83rem">المادة</th>'

  }

  html+='<div class="sign"><div class="sign-box"><div class="sign-line">ختم المدرسة</div></div>'
    +'<div class="sign-box"><div class="sign-line">توقيع مدير المدرسة</div></div></div>'
    +'<div class="date">تاريخ الإصدار: '+today+'</div>'
    +'<div class="bot-bar"></div>'
    +'</div></body></html>';

  var w=window.open('','_blank','width=900,height=700');
  w.document.write(html);w.document.close();
  w.onload=function(){w.print();};
}

// ===== PRINT CERTIFICATE =====
function printCertificate(){
  if(!currentStudent) return;
  var rec=currentStudent,cm=rec._colMap;
  var name  =cellVal(rec,cm.name)      ||'—';
  var grade =cellVal(rec,cm.grade)     ||currentGradeLabel;
  var total =cellVal(rec,cm.total)     ||'—';
  var pct   =cellVal(rec,cm.percent)   ||'—';
  var glabel=cellVal(rec,cm.gradeLabel)||'—';
  var today =new Date().toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'});

  var html='<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">'
    +'<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;800;900&display=swap" rel="stylesheet">'

    +'.inner{width:100%;max-width:270mm;min-height:175mm;background:#fff;position:relative;padding:44px 60px;text-align:center;'

    +'.tl{top:22px;right:22px;border-top:3px solid #6c63ff;border-right:3px solid #6c63ff;border-radius:0 8px 0 0}'
    +'.tr{top:22px;left:22px;border-top:3px solid #6c63ff;border-left:3px solid #6c63ff;border-radius:8px 0 0 0}'
    +'.bl{bottom:22px;right:22px;border-bottom:3px solid #6c63ff;border-right:3px solid #6c63ff;border-radius:0 0 0 8px}'
    +'.br{bottom:22px;left:22px;border-bottom:3px solid #6c63ff;border-left:3px solid #6c63ff;border-radius:0 0 8px 0}'
    +'.star-row{font-size:1.6rem;color:#f59e0b;letter-spacing:6px;margin-bottom:10px}'
    +'.title{font-size:2.2rem;font-weight:900;background:linear-gradient(135deg,#6c63ff,#ff6584);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:2px}'
    +'.en-title{font-size:.88rem;color:#9ca3af;font-weight:600;margin-bottom:16px}'
    +'.div{width:80px;height:3px;background:linear-gradient(90deg,#6c63ff,#ff6584);margin:0 auto 18px;border-radius:2px}'
    +'.presented{font-size:.88rem;color:#6b7280;margin-bottom:6px;font-weight:600}'
    +'.student-name{font-size:2.8rem;font-weight:900;color:#1e1b4b;margin-bottom:18px;padding:8px 0;border-top:2px solid #ede9fe;border-bottom:2px solid #ede9fe}'
    +'.body-text{font-size:.88rem;color:#4b5563;line-height:2;max-width:520px;margin:0 auto 20px;font-weight:500}'
    +'.meta{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin-bottom:24px}'
    +'.meta-item{text-align:center;background:#f5f3ff;border:1px solid #ede9fe;border-radius:10px;padding:10px 18px;min-width:110px}'
    +'.meta-label{font-size:.7rem;color:#7c3aed;font-weight:700;margin-bottom:3px}'
    +'.meta-val{font-size:1rem;font-weight:900;color:#1e1b4b}'

    +'</style></head><body>'
    +'<div class="cert"><div class="inner">'
    +'<div class="corner tl"></div><div class="corner tr"></div>'

    +'<div class="star-row">&#9733; &#9733; &#9733;</div>'
    +'<div class="title">شهادة تقدير وامتياز</div>'
    +'<div class="en-title">Certificate of Excellence &amp; Appreciation</div>'

    +'</div>'
    +'<div class="sign"><div class="sign-col"><div class="sign-line">ختم المدرسة</div></div>'
    +'<div class="sign-col"><div class="sign-line">توقيع مدير المدرسة</div></div></div>'
    +'<div class="date">تاريخ الإصدار: '+today+'</div>'
    +'</div></div></body></html>';

  var w=window.open('','_blank','width=1000,height=760');
  w.document.write(html);w.document.close();
  w.onload=function(){w.print();};
}
</script>
